name: 🚀 Release

# Only trigger when a version tag is pushed to the main branch.
# The tag must follow semantic versioning: v1.2.3
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    branches:
      - main

# Prevent concurrent releases
concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_VERSION: '9.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_XMLDOC_MODE: skip
  APP_ID: com.italokbb.slimenexus
  APP_NAME: SlimeNexus

jobs:
  # ─── Guard: only run the release job when the tag is on main ───────────────
  validate-tag:
    name: 🔍 Validate tag is on main
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ✅ Assert tag is reachable from main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor ${{ github.sha }} origin/main; then
            echo "❌ Tag '${{ github.ref_name }}' is not on the main branch. Aborting."
            exit 1
          fi
          echo "✅ Tag is on main branch."

      - name: 📌 Extract version number
        id: extract
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version: $VERSION"

  # ─── Build & Package ───────────────────────────────────────────────────────
  build:
    name: 📦 Build & Package (${{ matrix.rid }})
    needs: validate-tag
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
            artifact_ext: exe
            velopack_os: win
          - rid: linux-x64
            runner: ubuntu-latest
            artifact_ext: AppImage
            velopack_os: linux
          - rid: osx-x64
            runner: macos-latest
            artifact_ext: dmg
            velopack_os: osx

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📦 Restore NuGet packages
        run: dotnet restore SlimeNexus.sln

      - name: 🏗️ Build & Publish (${{ matrix.rid }})
        run: >
          dotnet publish src/SlimeNexus.UI/SlimeNexus.UI.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --output publish/${{ matrix.rid }}
          -p:Version=${{ needs.validate-tag.outputs.version }}
          -p:AssemblyVersion=${{ needs.validate-tag.outputs.version }}
          -p:FileVersion=${{ needs.validate-tag.outputs.version }}

      - name: 🛠️ Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: 📦 Package with Velopack (${{ matrix.rid }})
        run: >
          vpk pack
          --packId "${{ env.APP_ID }}"
          --packVersion "${{ needs.validate-tag.outputs.version }}"
          --packDir "publish/${{ matrix.rid }}"
          --outputDir "installer/releases/${{ matrix.rid }}"

      - name: ⬆️ Upload release artifacts (${{ matrix.rid }})
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: installer/releases/${{ matrix.rid }}/
          retention-days: 7

  # ─── Create GitHub Release ─────────────────────────────────────────────────
  github-release:
    name: 🏷️ Create GitHub Release
    needs: [ validate-tag, build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: ⬇️ Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: all-artifacts/
          merge-multiple: false

      - name: 📋 List artifacts
        run: find all-artifacts/ -type f | sort

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "🟢 SlimeNexus ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            all-artifacts/**/*
          body: |
            ## 🟢 SlimeNexus ${{ github.ref_name }}

            Cross-platform desktop agent that bridges your Slime Tamagotchi with local AI.

            ### 📥 Downloads

            | Platform | File |
            |---------|------|
            | 🪟 Windows | `SlimeNexus-Setup.exe` |
            | 🐧 Linux   | `SlimeNexus-linux.AppImage` |
            | 🍎 macOS   | `SlimeNexus-mac.dmg` |

            ### ⚠️ Requirements
            - [Ollama](https://ollama.ai/) with `llama3` model
            - AMD GPU (RDNA 2/3 recommended) or any GPU supported by LibreHardwareMonitor

            See [CHANGELOG](CHANGELOG.md) for full details.
